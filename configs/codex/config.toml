# Portable Codex defaults managed by Dots.
# Machine-local notification and runtime state remain in ~/.codex/config.toml.

# Default to non-interactive execution with OpenAI's built-in unrestricted
# permission profile.
# Host-managed restrictions still take precedence.
approval_policy = "never"
default_permissions = ":danger-full-access"

[apps._default]
default_tools_approval_mode = "approve"
open_world_enabled = true
destructive_enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."dots@dots"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."pulse@dots"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."messages@openai-bundled"]
enabled = true

[desktop]
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "right"
reviewDelivery = "detached"
show-context-window-usage = true
git-pull-request-merge-method = "squash"

[desktop.appearanceLightChromeTheme.fonts]
code = "SF Mono Terminal"

[desktop.appearanceDarkChromeTheme.fonts]
code = "SF Mono Terminal"
