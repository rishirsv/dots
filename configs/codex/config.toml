# Portable Codex defaults managed by Dots.
# Machine-local notification and runtime state remain in ~/.codex/config.toml.

# Default to non-interactive execution with the documented Dots permission
# profile. Host-managed restrictions still take precedence.
approval_policy = "never"
default_permissions = "Dots"

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[permissions.Dots]
description = "Unrestricted filesystem, network, and Unix socket access."

[permissions.Dots.filesystem]
":root" = "write"

[permissions.Dots.network]
enabled = true
allow_local_binding = true
dangerously_allow_all_unix_sockets = true

[apps._default]
default_tools_approval_mode = "approve"
open_world_enabled = true
destructive_enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."dots@dots"]
enabled = true

[plugins."meta-skill@dots"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."build-ios-apps@openai-curated"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."pulse@dots"]
enabled = false

[desktop]
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_PROSE"
defaultTerminalLocation = "right"
reviewDelivery = "detached"
show-context-window-usage = true
git-pull-request-merge-method = "squash"

[desktop.appearanceLightChromeTheme]
accent = "#339cff"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
code = "SF Mono Terminal"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = "SF Mono Terminal"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"
