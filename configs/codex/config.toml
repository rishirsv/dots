# Portable Codex defaults managed by Dots.
# Machine-local notification and runtime state remain in ~/.codex/config.toml.

# Default to non-interactive execution with unrestricted filesystem and
# network access. Codex Desktop reads this legacy pair in its Settings UI.
# Host-managed restrictions still take precedence.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_catalog_json = "/Users/rishi/.codex/models-combined.json"

# Managed by Portal: Responses use the local bridge; Voice stays on ChatGPT.
openai_base_url = "http://127.0.0.1:17841/v1"
experimental_realtime_webrtc_call_base_url = "https://chatgpt.com/backend-api/codex"
[features]
context_management = true

multi_agent = true # Managed by Portal: enables routed Web subagents.
multi_agent_v2 = false # Managed by Portal: keeps routed Web subagent payloads readable.
[model_providers.vercel-ai-gateway]
name = "Vercel AI Gateway"
base_url = "https://ai-gateway.vercel.sh/v1"
wire_api = "responses"
requires_openai_auth = false

[model_providers.vercel-ai-gateway.auth]
command = "/usr/bin/security"
args = ["find-generic-password", "-s", "com.openai.codex.vercel-ai-gateway", "-w"]

[apps._default]
default_tools_approval_mode = "approve"
open_world_enabled = true
destructive_enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."dots@dots"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."messages@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[desktop]
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "right"
reviewDelivery = "detached"
show-context-window-usage = true
git-pull-request-merge-method = "squash"
worktree-upstream-refresh-mode = "best-effort"
preventSleepWhileRunning = true

[desktop.appearanceLightChromeTheme.fonts]
code = "SF Mono Terminal"

[desktop.appearanceDarkChromeTheme.fonts]
code = "SF Mono Terminal"
