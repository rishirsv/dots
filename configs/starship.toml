# Focused prompt: path and a clean prompt symbol.
# Colors stay readable in both light and dark terminals.

format = """
$directory
$character"""

right_format = ""
add_newline = true

[directory]
style = "bold #0077cc"
home_symbol = "~"
truncation_length = 3
truncation_symbol = ".../"
read_only = " ro"

[character]
success_symbol = "[❯](bold #178c45)"
error_symbol = "[❯](bold #d12f2b)"
vimcmd_symbol = "[❮](bold #178c45)"
