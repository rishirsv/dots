interface:
  display_name: "Review"
  short_description: "Review changed code and challenge weak decisions"
  icon_small: "../../assets/icon.png"
  icon_large: "../../assets/logo.png"
  brand_color: "#36C5A7"
  default_prompt: "Use $review as a post-change pass. Scale Low, Default, or Deep review depth to the change, keep reviewers read-only, then have the main agent address retained findings and validate the result. Use Challenge only when I ask."

policy:
  allow_implicit_invocation: true
