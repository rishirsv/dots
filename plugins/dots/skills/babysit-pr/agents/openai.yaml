interface:
  display_name: "Babysit PR"
  short_description: "Monitor and repair a pull request until clean"
  icon_small: "../../assets/icon.png"
  icon_large: "../../assets/logo.png"
  brand_color: "#3B82F6"
  default_prompt: "Use $babysit-pr to monitor this pull request, handle current failures and review feedback within its original goal, and continue until it is clean or blocked."

policy:
  allow_implicit_invocation: true
