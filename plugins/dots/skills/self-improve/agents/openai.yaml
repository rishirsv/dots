interface:
  display_name: "Self-Improve"
  short_description: "Mine Codex or Claude sessions for durable agent improvements"
  icon_small: "../../assets/icon.png"
  icon_large: "../../assets/logo.png"
  brand_color: "#3B82F6"
  default_prompt: "Use $self-improve to review at most 100 Codex or Claude Code sessions from the last 30 days, inspect the files behind repeated corrections or friction, and propose up to three evidence-backed improvements. Expand only for a concrete evidence gap. Do not run a deep or full-history review unless I explicitly ask. Propose only; do not edit without approval."

policy:
  allow_implicit_invocation: false
