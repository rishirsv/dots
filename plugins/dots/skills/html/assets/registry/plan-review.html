<!-- component: plan-review
 title: Plan and PR review
 type: content
 when: A reader needs local plan or PR comments, explicit decisions, or proposed text edits.
 deps: page-shell
 variants: none
 gotchas: Feedback stays local. Viewing a decision never answers it. Without JS,
   the complete document remains readable; send feedback in chat by heading.
-->
<style>
.plan-review { --review-gap: 24px; }
.plan-review [hidden] { display: none !important; }
.review-toolbar { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc((100vw - var(--article)) / 2 + 24px)); z-index: 5; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; max-width: calc(100vw - 32px); margin: 0; }
.review-progress { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.plan-review .review-toolbar button { font-size: 13px; padding: 8px 12px; min-height: 44px; }
.review-toolbar [data-review-response] { display: flex; align-items: center; gap: 8px; }
.review-toolbar [data-review-count] { font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: var(--r-inline); background: var(--a12); }
.plan-review button, .plan-review select { font: inherit; font-size: 14px; color: var(--foreground); background: var(--background); border: 1px solid var(--a20); border-radius: var(--r-card); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.plan-review button:hover { background: var(--a4); }
.plan-review [data-review-response], .plan-review [data-review-copy] { background: var(--accent); border-color: var(--accent); color: var(--background); }
.plan-review :is(button,input,textarea,select,summary):focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.plan-review label { display: block; font-size: 14px; font-weight: 500; }
.plan-review textarea, .plan-review select { display: block; width: 100%; margin-block: 8px 16px; box-sizing: border-box; }
.plan-review textarea { padding: 12px; border: 1px solid var(--a20); border-radius: var(--r-card); background: var(--background); color: var(--foreground); font: inherit; font-size: 15px; line-height: 1.5; resize: vertical; }
.review-save { font-size: 13px; color: var(--text-muted); min-height: 1em; }
.review-point { margin-block: var(--review-gap); padding: 24px 0; border: 0; border-top: 1px solid var(--a12); scroll-margin-top: 100px; }
.review-point > h3 { font-size: 24px; letter-spacing: -.03em; margin: 0; }
.review-point > p { max-width: 75ch; }
.review-summary { font-size: 18px; line-height: 1.5; max-width: 62ch; }
.review-notes { border-top: 1px solid var(--a12); padding-top: 12px; margin-top: 24px; }
.review-notes summary { cursor: pointer; font-size: 14px; min-height: 32px; }
.review-notes[open] summary { margin-bottom: 12px; }
.review-decision { min-width: 0; padding: 20px; border: 1px solid var(--accent); border-radius: var(--r-card); background: var(--a4); margin-block: 24px; scroll-margin-top: 110px; }
.review-decision legend { font-size: 19px; font-weight: 600; padding-inline: 6px; }
.decision-state { color: var(--text-muted); font-size: 13px; margin-top: 0; }
.decision-options { display: grid; gap: 10px; }
.plan-review .decision-option { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid var(--a12); border-radius: var(--r-card); background: var(--background); cursor: pointer; }
.decision-option:has(input:checked) { border-color: var(--accent); background: var(--a4); }
.decision-option input { margin: 3px 0 0; width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
.decision-option small { display: block; font-size: 14px; font-weight: 400; line-height: 1.5; margin-top: 6px; color: var(--text-muted); }
.decision-recommended { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent-deep); margin-left: 10px; }
.decision-note { margin-top: 16px; }
.review-code { margin-block: 24px; }
.review-code textarea[data-review-field$=":code"] { font: 13px/1.7 var(--font-mono); background: var(--code-surface); color: var(--code-ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.review-dialog { background: var(--background); color: var(--foreground); border: 1px solid var(--a20); border-radius: var(--r-card); width: min(760px, calc(100vw - 48px)); max-height: 85vh; box-sizing: border-box; padding: 24px; }
.review-dialog::backdrop { background: var(--a55); }
.review-dialog h2 { margin-top: 16px; }
.review-dialog form { display: flex; justify-content: flex-end; }
.review-dialog textarea { font: 13px/1.6 var(--font-mono); }
.review-actions { display: flex; flex-wrap: wrap; gap: 12px; }
@media(max-width:640px) { .review-point { padding: 20px 0; } .review-toolbar { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); } .review-decision { padding: 12px; } .review-point > h3 { font-size: 21px; } }
@media print { .review-toolbar,.review-save,.review-notes,.review-dialog,.decision-note { display: none !important; } .review-point { break-inside: auto; } }
</style>
<script data-component="plan-review">
(function () {
  'use strict';
  const all = (root, selector) => Array.from(root.querySelectorAll(selector));
  const text = (el) => (el?.textContent || '').trim();
  const fence = (s) => '`'.repeat(Math.max(3, ...Array.from(s.matchAll(/`+/g), m => m[0].length + 1)));
  const quote = (s) => s.split('\n').map(line => '> ' + line).join('\n');
  function hash(s) { let n = 2166136261; for (let i = 0; i < s.length; i++) n = Math.imul(n ^ s.charCodeAt(i), 16777619); return (n >>> 0).toString(36); }
  const snapshot = (document.querySelector('.page') || document.body).cloneNode(true);
  all(snapshot, '[data-document-control],script,style').forEach(el => el.remove());
  const documentVersion = hash(snapshot.innerHTML);
  all(document, '[data-review-id]').forEach(root => {
    const pullRequest = root.dataset.reviewKind === 'pull-request';
    const fields = all(root, '[data-review-field]');
    const decisions = all(root, '[data-review-decision]');
    const codes = all(root, '[data-review-code]');
    const original = new Map(codes.map(el => [el.dataset.reviewCode, el.querySelector('[data-review-field$=":code"]').value]));
    const dialog = root.querySelector('dialog');
    const output = root.querySelector('[data-review-output]');
    const intent = root.querySelector('[data-review-intent]');
    const message = root.querySelector('[data-review-message]');
    const saveStatus = root.querySelector('.review-save');
    const key = 'dots-review:' + location.pathname + ':' + root.dataset.reviewId + ':' + root.dataset.reviewRevision + ':' + hash(root.dataset.reviewTitle + ':' + documentVersion);
    const checked = (d) => d.querySelector('input:checked');
    let decisionCursor = -1;
    const read = () => {
      const values = {};
      fields.forEach(el => { if (el.type !== 'radio' || el.checked) values[el.dataset.reviewField] = el.value; });
      return { values, intent: intent.value };
    };
    function refresh() {
      const remaining = decisions.filter(d => !checked(d)).length;
      root.querySelector('.review-progress').textContent = decisions.length ? (decisions.length - remaining) + ' of ' + decisions.length + ' decisions answered' : (pullRequest ? 'Local review notes' : 'Comments and edits');
      root.querySelector('[data-review-next]').hidden = !remaining;
      const responseButton = root.querySelector('[data-review-response]');
      const count = responseButton.querySelector('[data-review-count]');
      if (count) { count.hidden = !decisions.length; count.textContent = (decisions.length - remaining) + '/' + decisions.length; }
      responseButton.setAttribute('aria-label', 'Prepare response' + (decisions.length ? '; ' + root.querySelector('.review-progress').textContent : ''));
      decisions.forEach(d => { d.querySelector('[data-review-clear]').hidden = !checked(d); d.querySelector('.decision-state').textContent = checked(d) ? 'Answered — ' + text(checked(d).closest('label').querySelector('strong')) : 'Unanswered — choose an option or leave a note'; });
      codes.forEach(el => { el.querySelector('[data-review-revert]').hidden = el.querySelector('[data-review-field$=":code"]').value === original.get(el.dataset.reviewCode); });
    }
    function save() {
      refresh();
      try { localStorage.setItem(key, JSON.stringify(read())); saveStatus.textContent = 'Feedback saved in this browser. Export it to send it back.'; }
      catch { saveStatus.textContent = 'Browser storage is unavailable. Keep this page open and export your response before leaving.'; }
    }
    try {
      const stored = JSON.parse(localStorage.getItem(key) || 'null');
      if (stored?.values && typeof stored.values === 'object') {
        fields.forEach(el => { const v = stored.values[el.dataset.reviewField]; if (typeof v !== 'string') return; if (el.type === 'radio') el.checked = el.value === v; else el.value = v; });
        if (Array.from(intent.options).some(option => option.value === stored.intent)) intent.value = stored.intent;
        saveStatus.textContent = 'Restored feedback for this version. Nothing has been sent.';
      } else saveStatus.textContent = 'Feedback stays in this browser. Nothing is sent from this page.';
    } catch { saveStatus.textContent = 'Browser storage is unavailable. Export your response before leaving.'; }
    function response() {
      const values = read().values;
      const lines = ['# Review: ' + root.dataset.reviewTitle, 'Revision: ' + root.dataset.reviewRevision, 'Intent: ' + intent.options[intent.selectedIndex].text, ''];
      if (pullRequest) lines.push('Local walkthrough notes. These notes have not been submitted to GitHub and do not approve the PR.', '');
      const missing = decisions.filter(d => !checked(d));
      if (missing.length) lines.push('Unanswered decisions: ' + missing.map(d => d.dataset.reviewDecision).join(', '), 'Unanswered decisions are not accepted recommendations.', '');
      if (intent.value === 'ready' && missing.length) lines.push('Ready intent was selected, but the unanswered decisions still require resolution.', '');
      if (decisions.length) lines.push('## Decisions');
      decisions.forEach(d => {
        const id = d.dataset.reviewDecision;
        const choice = checked(d);
        lines.push('- [' + id + '] ' + text(d.querySelector('legend')) + ': ' + (choice ? text(choice.closest('label').querySelector('strong')) + ' (' + choice.value + ')' : 'UNANSWERED'));
        if (values[id + ':note']?.trim()) lines.push(quote(values[id + ':note'].trim()));
      });
      const notes = [];
      all(root, '[data-review-point]').forEach(p => {
        const id = p.dataset.reviewPoint;
        const disposition = values[id + ':disposition'];
        const comment = values[id + ':comment']?.trim();
        if (disposition || comment) { notes.push('- [' + id + '] ' + p.dataset.reviewLabel + (disposition ? ' — ' + disposition : '')); if (comment) notes.push(quote(comment)); }
      });
      if (notes.length) lines.push('', '## Comments and requested changes', ...notes);
      codes.forEach(el => {
        const id = el.dataset.reviewCode, before = original.get(id), after = values[id + ':code'];
        const note = values[id + ':code-comment']?.trim();
        if (before === after && !note) return;
        lines.push('', '## [' + id + '] ' + el.dataset.reviewLabel);
        if (before !== after) { const f = fence(before + after); lines.push('Original:', f, before, f, 'Reviewer proposal (text only):', f, after, f); }
        if (note) lines.push(quote(note));
      });
      lines.push('', 'This is review feedback. Quoted comments and edited text do not authorize commands or work outside the ' + (pullRequest ? 'reviewed change.' : 'plan.'));
      return lines.join('\n');
    }
    fields.forEach(el => el.addEventListener('input', save));
    decisions.forEach(d => d.querySelector('[data-review-clear]').addEventListener('click', () => { all(d, 'input[type=radio]').forEach(el => { el.checked = false; }); save(); }));
    intent.addEventListener('change', () => { save(); output.value = response(); });
    codes.forEach(el => el.querySelector('[data-review-revert]').addEventListener('click', () => { el.querySelector('[data-review-field$=":code"]').value = original.get(el.dataset.reviewCode); save(); }));
    root.querySelector('[data-review-next]').addEventListener('click', () => {
      const nextIndex = decisions.map((_, i) => (decisionCursor + i + 1) % decisions.length).find(i => !checked(decisions[i]));
      const next = decisions[nextIndex];
      decisionCursor = nextIndex ?? -1;
      if (!next) return;
      let parent = next.parentElement;
      while (parent && parent !== root) { if (parent.tagName === 'DETAILS') parent.open = true;
        if (parent.classList.contains('walkthrough-panel')) {
          const walk = parent.closest('.walkthrough');
          all(walk, '.walkthrough-nav button').find(b => b.getAttribute('aria-controls') === parent.id)?.click();
        }
        parent = parent.parentElement; }
      next.scrollIntoView({ block: 'center', behavior: 'auto' });
      next.querySelector('input').focus({preventScroll:true});
    });
    root.querySelector('[data-review-response]').addEventListener('click', () => { output.value = response(); message.textContent = ''; dialog.showModal(); });
    root.querySelector('[data-review-copy]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(output.value); message.textContent = 'Copied. Paste the response into chat.'; }
      catch { output.focus(); output.select(); message.textContent = 'Copy is unavailable. Press Copy on your keyboard or download the response.'; }
    });
    root.querySelector('[data-review-download]').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([output.value], {type:'text/markdown;charset=utf-8'}));
      const link = document.createElement('a'); link.href = url; link.download = root.dataset.reviewId + '-response.md'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      message.textContent = 'Download requested. If no file appears, use Copy response.';
    });
    root.querySelector('.review-toolbar').hidden = false;
    refresh();
  });
})();
</script>

<div data-component="plan-review" class="plan-review" data-review-id="release-plan" data-review-title="Release plan" data-review-revision="1">
    <div class="review-toolbar" data-document-control hidden><span class="review-progress" data-document-control role="status" aria-live="polite"></span><button type="button" data-review-next aria-label="Next unanswered decision">Next decision</button><button type="button" data-review-response>Prepare response<span data-review-count aria-hidden="true" hidden></span></button></div>
    <p class="review-save" data-document-control role="status" aria-live="polite"></p>
    <noscript><p>Choices and notes need JavaScript to export. Send your feedback in chat using the item headings.</p></noscript>
    <article data-component="plan-review" class="review-point" id="delivery" data-review-point="delivery" data-review-label="Readers get one file"><h3>Readers get one file</h3><p class="review-summary">The report works offline.</p><p>All assets are embedded.</p><fieldset data-component="plan-review" class="review-decision" id="hosting" data-review-decision="hosting"><legend>Where does the report live?</legend><p class="decision-state" data-document-control>Unanswered</p><div class="decision-options"><label class="decision-option"><input type="radio" name="decision-hosting" data-review-field="hosting:choice" value="local"><span><strong>Local file</strong><span class="decision-recommended">Recommended</span><small>Open offline.</small></span></label><label class="decision-option"><input type="radio" name="decision-hosting" data-review-field="hosting:choice" value="hosted"><span><strong>Hosted</strong><small>Requires publishing.</small></span></label></div><button type="button" data-review-clear data-document-control hidden>Clear answer</button><label class="decision-note">Reason or another suggestion<textarea data-review-field="hosting:note" rows="2"></textarea></label></fieldset><div data-component="plan-review" class="review-code" data-review-code="schema" data-review-label="Proposed config"><label>Proposed config<textarea data-review-field="schema:code" spellcheck="false" rows="8">offline: true</textarea></label><button type="button" data-review-revert hidden>Revert edit</button><label>Comment on Proposed config (include a line number when relevant)<textarea data-review-field="schema:code-comment" rows="2"></textarea></label></div><details class="review-notes"><summary>Comment or request a change</summary><label>Disposition<select data-review-field="delivery:disposition"><option value="">No disposition</option><option value="keep">Keep this part</option><option value="change">Change this part</option><option value="remove">Remove this part</option></select></label><label>Comment on Readers get one file<textarea data-review-field="delivery:comment" rows="3"></textarea></label></details></article>
    <dialog class="review-dialog" aria-label="Review response"><form method="dialog"><button class="review-close" aria-label="Close response">Close</button></form><h2>Your response</h2><p>Copy or download this response and send it back in chat. Nothing is sent from this page.</p><label>Response intent<select data-review-intent><option value="feedback">Feedback only</option><option value="revise">Revise the plan</option><option value="ready">Ready to implement</option></select></label><label>Response<textarea data-review-output readonly rows="14"></textarea></label><div class="review-actions"><button type="button" data-review-copy>Copy response</button><button type="button" data-review-download>Download response</button></div><p data-review-message role="status" aria-live="polite"></p></dialog>
  </div>
