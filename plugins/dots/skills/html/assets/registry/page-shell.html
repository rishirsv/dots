<!-- component: page-shell
title: Page shell
type: block
when: Every page starts here. The document skeleton: header (title and dek),
  article column, and footer slot.
deps: theme.css (inline verbatim in <style> before component CSS)
variants: article (default, text with embedded figures) | wide (parallel evidence) | canvas
  (visual references; keep prose in .reading-column).
gotchas: Start with the title; omit eyebrows. Put document metadata in the footer.
  Replace slot comments with real content; keep section ids stable —
  the TOC rail targets them. Add page-behavior only when the page needs
  progressive enhancement.
-->
<style>
  .page {
    max-width: var(--article);
    margin: 0 auto;
    padding: 64px 24px 96px;
  }
  .page[data-layout="wide"] { max-width: var(--wide); }
  .page[data-layout="canvas"] { max-width: var(--canvas); }
  .reading-column { max-width: var(--article); }
  .page[data-layout="article"] .reading-column,
  .page[data-layout="wide"] .reading-column { margin-right: auto; }
  .page[data-layout="canvas"] .reading-column { margin-left: auto; margin-right: auto; }
  .page > header { margin-bottom: var(--section); }
  .title-row {
    margin-bottom: 8px;
  }
  .page section > p { max-width: 75ch; }
  .dek { font-size: 16px; color: var(--text-muted); margin: 0; max-width: 62ch; }
  footer.sources {
    margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--a12);
    font-size: 12px; color: var(--text-muted); line-height: 1.7;
  }
  footer.sources a { color: var(--text-muted); }
  @media (max-width: 680px) {
    .page { padding: 40px 24px 72px; }
  }
</style>

<div data-component="page-shell" class="page" data-layout="article">
  <header class="stagger">
    <div class="title-row">
      <h1>Document title</h1>
    </div>
    <p class="dek">One-or-two-sentence dek: what this document is and the single decision or understanding it exists to drive.</p>
  </header>

  <!-- slot: breadcrumbs (optional navigation for hierarchical page sets) -->

  <!-- slot: toc-rail (optional, for 6+ sections or non-linear lookup) -->
  <!-- slot: sections — each <section id="..."> with an <h2> -->

  <footer class="sources">
    Sources: <!-- reader-facing sources, if needed -->
  </footer>
</div>
