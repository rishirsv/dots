interface:
  display_name: "PR"
  short_description: "Create, update, or watch a GitHub pull request"
  icon_small: "../../assets/icon.png"
  icon_large: "../../assets/logo.png"
  brand_color: "#3B82F6"
  default_prompt: "Use $pr to create a draft pull request from the intended local changes. Verify repository and identity, publish only scoped work, and write the body as a durable decision record and review guide grounded in the current diff, human decisions, and observed evidence."

policy:
  allow_implicit_invocation: false
