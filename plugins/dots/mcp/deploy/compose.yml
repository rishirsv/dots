services:
  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong private database password}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL URI pointing to postgres on the private network}
      PUBLIC_ORIGIN: https://${PORTAL_HOST:?Set owned relay hostname}
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Set established provider issuer}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:?Set exact resource audience}
      OAUTH_JWKS_URI: ${OAUTH_JWKS_URI:?Set provider JWKS URL}
      OAUTH_AUTHORIZATION_ENDPOINT: ${OAUTH_AUTHORIZATION_ENDPOINT}
      OAUTH_TOKEN_ENDPOINT: ${OAUTH_TOKEN_ENDPOINT}
      OWNER_CLIENT_ID: ${OWNER_CLIENT_ID}
      OWNER_CLIENT_SECRET: ${OWNER_CLIENT_SECRET}
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [private, outbound]
  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports: ["80:80", "443:443"]
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    networks: [private, outbound]
networks:
  private: {internal: true}
  outbound: {}
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
