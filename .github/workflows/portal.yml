name: Portal verification

on:
  push:
    paths:
      - "plugins/dots/mcp/**"
      - "plugins/dots/.codex-plugin/plugin.json"
      - "plugins/dots/.claude-plugin/plugin.json"
      - "plugins/dots/plugin.json"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "plugins/dots/mcp/**"
      - "plugins/dots/.codex-plugin/plugin.json"
      - "plugins/dots/.claude-plugin/plugin.json"
      - "plugins/dots/plugin.json"
      - ".github/workflows/portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/dots/mcp

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Portal
        run: bun run verify
